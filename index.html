<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Store</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="logo">
        <span>
            <img width="100px" src="images/logo.png" alt="Store Logo" style="border: white; box-shadow: none;">
        </span>
        <span>
<h1 style="color: #a67c52; font-size: 40px;">PHI</h1>
        </span>
        <div class="navigation-bar">
            <button class="button">Regester</button>
            <a href="#" class="navigation-item"><span><img src="./images/cart.png" width="35" style="border: white; box-shadow: none;border-radius: 0;"></span></a>
            <a href="#" class="fav"><span><img src="./images/fav.png" width="35" style="border: white; box-shadow: none;"></span></a>
            <a href="./aboutUs.html" class="navigation-item"><span>About PHI</span></a>
            <a href="./contactUs.html" class="navigation-item"><span>Contact us</span></a>
            <a href="./index.html" class="navigation-item"><span>Home</span></a>
        </div>
    </div>

    <div class="landingpage">
        <div class="srsh">
            <div>
                <h1 id="welcome">Welcome to PHI</h1>
                <p style="color: aliceblue;">Find the best products for you</p>
            </div>
            <input type="text" placeholder="Search: jeans pants, basic body...">
            <button class="button2">Search</button>
        </div>

        <div>
            <img class="logo1" width="500px" src="./images/banner.jpg" alt="Clothes">
        </div>
    </div>


    <section class="featured-products">
        <h2 style="text-align: center; color: #a67c52;">Featured Products</h2>
        <div class="product-list">
            <div class="product-card">
                <img src="./images/ClassicJeans.png" alt="Product 1" width="180">
                <div class="product-info">
                    <h3>Classic Jeans</h3>
                    <p>$39.99</p>
                </div>
                <button class="button">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="./images/BasicT-Shirt.png" alt="Product 2" width="180">
                <div class="product-info">
                    <h3>Basic T-Shirt</h3>
                    <p>$19.99</p>
                </div>


                <button class="button">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="./images/hoody.png" alt="Product 3" width="180">

                <div class="product-info">
                    <h3>Hoody</h3>
                    <p>$36.5</p>
                </div>
                <button class="button">Add to Cart</button>
            </div>

        </div>
    </section>



    <footer>
        <p>&copy; 2025 PHI</p>
    </footer>

</body>

</html>
